global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "leviia-mcp"
    metrics_path: /metrics/prom
    scheme: http
    # Le tunnel SSH forward le port 8001 du VPS sur localhost:8001
    static_configs:
      - targets: ["host.docker.internal:8001"]
    authorization:
      type: Bearer
      credentials: "__MCP_API_KEY__"   # remplacer par la vraie clé (ou via env PROM_MCP_KEY)
